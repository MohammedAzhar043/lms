{% extends "base.html" %}
{% block title %}Edit Course - LearnByTech{% endblock %}
{% block content %}
<h1>Edit Course Details </h1>
<form method="post" action="{{url_for('course_edit',id=course.id)}}">
    <p>
        <label>title</label><br>
        <input type="text" name="title" value="{{course.title}}" required>

    </p>

    <p>
        <label>Description</label><br>
        <textarea name="description" rows="4" required>{{course.description}}</textarea>
    </p>

    <p>
        <label>Teacher</label><br>
        <select name="teacher_id" required>
            {% for teacher in teachers %}
            <option value="{{teacher.id}}" {% if teacher.id==course.teacher_id %}selected{% endif %}>
                {{teacher.username}}</option>
            {% endfor %}
        </select>
    </p>

    <p>
        <button type="submit">Update Course</button>
    </p>

</form>
{% endblock %}
