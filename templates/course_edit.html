{% extends "base.html" %}
{% block title %}Edit Course - LearnByTech{% endblock %}
{% block content %}
<div class="course-edit-page">
    <div class="course-edit-left">
        <h1>Edit Course</h1>
        <img src="{{url_for('static',filename='images/login-illustration.png.png')}}" alt="text">
    </div>
    <div class="course-edit-right">
        <form method="post" action="{{url_for('course_edit',id=course.id)}}" class="course-edit-form">
            <div class="form-group">
                <label for="title">title</label>
                <input type="text"  id="title" name="title" value="{{course.title}}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description"  id="description" rows="4" required>{{course.description}}</textarea>
            </div>
            <div class="form-group">
                <label for="teacher_id">Teacher</label><br>
                  <select id="teacher_id" name="teacher_id" required>
                   {% for teacher in teachers %}
                  <option value="{{teacher.id}}" {% if teacher.id==course.teacher_id %}selected{% endif %}>
                   {{teacher.username}}</option>
                 {% endfor %}
              </select>
            </div>
             <button class="btn-course-edit-submit" type="submit">Update Course</button>
             <p class="course-edit-link">
                <a href="{{url_for('course_detail',id =course.id)}}">Back to Courses </a>
                <a href="{{url_for('list_courses')}}">Cancel</a>
             </p>
        </form>
    </div>
</div>


</form>
{% endblock %}
