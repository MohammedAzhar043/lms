{% extends "base.html" %}
{% block title %}Add Course - LearnByTech{% endblock %}
{% block content %}
<h1>Add Course</h1>
<form method="post" action="{{url_for('course_create')}}">
    <p>
        <label>Title:</label><br>
        <input type="text" name="title" required value="{{title or ''}}">
    </p>
     <p>
        <label>Description:</label><br>
        <textarea name="description"  rows= "4" required >{{description or ''}}</textarea>
    </p>
    <p>
            <label>Teacher:</label><br>
            <select name="teacher_id" required>
                {% for teacher in teachers %}
                <option value="{{ teacher.id }}">{{ teacher.username }}</option>
                {% endfor %}
            </select>   
    <button type="submit">Create Course</button>
</form>
<p>
    <a href="{{url_for('list_courses')}}">Back to Courses</a>
</p>
{% endblock %}
